name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # укажите вашу версию

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # если есть

      - name: Create test database (if separate from main)
        run: |
          # Ждём, пока PostgreSQL полностью запустится
          sleep 5
          # Создаём вторую БД, если вам нужно отдельное имя для тестов (db_name_test)
          PGPASSWORD=test_pass psql -h localhost -U test_user -d test_db -c "CREATE DATABASE test_db_test;"
        env:
          PGPASSWORD: test_pass  # для команды psql

      - name: Run tests
        env:
          DB_USER: test_user
          DB_PASS: test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_NAME_TEST: test_db_test   # имя второй БД, если создали отдельно
        run: pytest -v
